<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dola Pool · AI 视频生成池化平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▣</text></svg>">
<style>
:root{
  --bg:#0a0f11; --panel:rgba(20,26,28,.86); --panel-2:rgba(14,19,21,.9);
  --line:rgba(52,70,70,.55); --line-2:rgba(70,96,94,.45);
  --txt:#e6efed; --muted:#8ba1a1; --dim:#6a7d7e;
  --brand:#0ca58c; --brand-2:#078d78; --warn:#ffc56d; --bad:#ff8b87; --ok:#7be2ad;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt); background:var(--bg); min-height:100vh; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
#bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;transition:opacity .8s}
#bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,14,.86),rgba(8,12,14,.93))}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3a3a;border-radius:6px}

/* ---------- 布局 ---------- */
aside{
  position:fixed;inset:0 auto 0 0;width:210px;z-index:40;
  background:linear-gradient(180deg,rgba(16,30,33,.96),rgba(11,17,19,.97));
  border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto;
}
aside .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 18px}
aside .brand b{font-size:16px;letter-spacing:.5px}
aside .brand small{display:block;font-size:10px;color:#6fbfae;letter-spacing:1.6px}
nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  color:#b9c9c9;padding:10px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;margin-bottom:2px;
  transition:.15s;
}
nav button:hover{background:rgba(12,165,140,.14);color:#fff}
nav button.active{background:linear-gradient(90deg,var(--brand-2),rgba(7,141,120,.25));color:#fff;font-weight:600}
nav .grp{font-size:10px;color:#5f7476;letter-spacing:1.4px;padding:14px 12px 6px}
aside .sidefoot{margin-top:14px;padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}

main{margin-left:210px;padding:20px 24px 60px;min-height:100vh}
.topbar{
  display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;
  border-bottom:1px solid var(--line)
}
.topbar h1{font-size:20px;margin:0;flex:1}
.pill{
  font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);
  color:var(--muted);white-space:nowrap;background:rgba(12,20,22,.6)
}
.pill.ok{color:var(--ok);border-color:rgba(123,226,173,.35)}
.pill.bad{color:var(--bad);border-color:rgba(255,139,135,.35)}
.pill.warn{color:var(--warn);border-color:rgba(255,197,109,.35)}
#hamburger{display:none}

/* ---------- 通用组件 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.panel h2 small{font-weight:400;color:var(--dim);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.spacer{flex:1}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;margin-top:4px}
.stat .s{font-size:11px;color:var(--dim);margin-top:2px}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input,select,textarea{
  width:100%;background:rgba(10,15,16,.85);color:var(--txt);border:1px solid var(--line-2);
  border-radius:9px;padding:10px 11px;font:inherit;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(12,165,140,.14)}
textarea{resize:vertical;min-height:110px;line-height:1.6}
button{font:inherit;cursor:pointer}
.btn{background:rgba(38,48,50,.9);color:var(--txt);border:1px solid var(--line-2);border-radius:9px;padding:9px 14px;transition:.15s}
.btn:hover{border-color:var(--brand);color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,139,135,.35)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
tbody tr:hover{background:rgba(12,165,140,.06)}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,197,109,.14);color:var(--warn)}
.badge.ok{background:rgba(123,226,173,.14);color:var(--ok)}
.badge.bad{background:rgba(255,139,135,.14);color:var(--bad)}
.badge.run{background:rgba(123,200,226,.16);color:#7bc8e2}
.badge.dim{background:rgba(139,161,161,.14);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:rgba(120,150,150,.18);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));transition:width .4s}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.empty{padding:34px 10px;text-align:center;color:var(--dim)}
.scroll-x{overflow-x:auto}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line-2);background:#0b1113}
.ref-thumb{position:relative;width:64px;height:64px;flex:0 0 auto}
.ref-thumb .ref-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;padding:0;line-height:18px;
  border-radius:50%;border:1px solid #3a4a4d;background:#182224;color:#dbe7e5;font-size:12px;cursor:pointer}
.ref-thumb .ref-del:hover{background:#7a2b2b;border-color:#b45;color:#fff}
.video-box{background:#05090a;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;
  justify-content:center;min-height:230px;color:var(--dim);overflow:hidden}
.video-box video{width:100%;max-height:460px;display:block;background:#000}

/* 分镜 */
.scene{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);padding:14px;margin-bottom:14px}
.scene header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.scene .no{font-size:22px;color:#41514f;font-weight:700;min-width:32px}
.scene .cols{display:grid;grid-template-columns:1fr 1.15fr 300px;gap:12px}
.scene textarea{min-height:210px;font-size:13px}
@media(max-width:1100px){.scene .cols{grid-template-columns:1fr}}

/* 模态 / 提示 */
.modal{position:fixed;inset:0;background:rgba(3,6,7,.78);backdrop-filter:blur(3px);z-index:80;
  display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal .box{background:#131a1c;border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:640px;
  max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.modal .box h3{margin:0 0 16px;font-size:16px}
.modal .box .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#toast{position:fixed;right:20px;bottom:22px;z-index:99;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#toast div{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;padding:11px 16px;border-radius:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);animation:up .25s ease}
#toast div.err{background:linear-gradient(135deg,#8f3b3b,#c2554f)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 移动端 */
@media(max-width:860px){
  aside{transform:translateX(-100%);transition:transform .25s ease;width:250px;box-shadow:0 0 40px rgba(0,0,0,.6)}
  aside.open{transform:none}
  main{margin-left:0;padding:66px 12px 80px}
  #hamburger{display:inline-flex}
  .topbar{position:fixed;top:0;left:0;right:0;background:rgba(12,18,20,.97);z-index:50;
    padding:12px;margin:0;border-bottom:1px solid var(--line)}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  .topbar h1{font-size:16px}
  .topbar .pill{display:none}
  table{font-size:12px}
  th,td{padding:8px 6px}
}
</style>
</head>
<body>
<div id="bg"></div>

<aside id="sidebar">
  <div class="brand"><span style="font-size:20px">▣</span>
    <div><b>Dola Pool</b><small>VIDEO PIPELINE</small></div>
  </div>
  <nav id="nav">
    <div class="grp">创作</div>
    <button data-page="dashboard">◎　概览</button>
    <button data-page="generate">✧　生成</button>
    <button data-page="storyboard">✦　分镜工作台</button>
    <button data-page="canvas">⚡　节点画布</button>
    <div class="grp">资源</div>
    <button data-page="tasks">☷　任务队列</button>
    <button data-page="accounts">♧　账号池</button>
    <button data-page="proxies">◈　代理与 IP</button>
    <button data-page="assets">▤　资产库</button>
    <div class="grp">系统</div>
    <button data-page="keys">⚿　API 密钥</button>
    <button data-page="settings">⚙　设置</button>
    <button data-page="logs">◉　日志</button>
  </nav>
  <div class="sidefoot">
    <div id="verLine">v{{VERSION}}</div>
    <div id="modeLine" class="dim"></div>
    <div id="aiLine" class="dim"></div>
  </div>
</aside>

<main>
  <div class="topbar">
    <button class="btn sm" id="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <h1 id="pageTitle">概览</h1>
    <span class="pill" id="pillQueue">队列 –</span>
    <span class="pill" id="pillProxy">代理 –</span>
    <span class="pill" id="pillMode"></span>
  </div>
  <section id="view"></section>
</main>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* ==================== 基础工具 ==================== */
const $ = (id) => document.getElementById(id);
const view = $('view'), modal = $('modal'), modalBox = $('modalBox');
const IS_DEMO = '{{DEMO}}' === '1';
const IS_DESKTOP = '{{DESKTOP}}' === '1';
const AI_READY = '{{AI}}' === '1';
const state = { page: 'dashboard', tasks: [], accounts: [], assets: [], timers: [], scenes: [] };

function esc(v){ return String(v === null || v === undefined ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toast(msg, isErr){
  const d = document.createElement('div');
  if (isErr) d.className = 'err';
  d.textContent = msg;
  $('toast').appendChild(d);
  setTimeout(() => d.remove(), 3200);
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'X-Admin-Token': localStorage.getItem('dola_token') || ''}, opts.headers || {});
  const res = await fetch('/' + path.replace(/^\//,''), Object.assign({}, opts, {headers}));
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = {error: text.slice(0,300)}; }
  if (!res.ok){
    if (res.status === 401) toast('未授权：请在登录页填写 DOLA_ADMIN_TOKEN', true);
    throw new Error((data && (data.error || data.detail)) || ('HTTP ' + res.status));
  }
  return data;
}

function fmtTime(s){
  if (!s) return '–';
  try { return new Date(s.replace(' ','T').replace('Z','') + (s.endsWith('Z') ? '' : 'Z'))
    .toLocaleString('zh-CN', {hour12:false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
  catch(e){ return s; }
}
function fmtBytes(n){
  n = Number(n || 0);
  if (n > 1073741824) return (n/1073741824).toFixed(2) + ' GB';
  if (n > 1048576) return (n/1048576).toFixed(1) + ' MB';
  if (n > 1024) return (n/1024).toFixed(0) + ' KB';
  return n + ' B';
}
function statusBadge(s){
  const map = {completed:'ok', running:'run', queued:'dim', failed:'bad', cancelled:'dim'};
  const label = {completed:'已完成', running:'生成中', queued:'排队中', failed:'失败', cancelled:'已取消'};
  return '<span class="badge ' + (map[s]||'') + '">' + (label[s] || esc(s||'–')) + '</span>';
}
function openModal(title, html, onOpen){
  modalBox.innerHTML = '<h3>' + title + '</h3>' + html;
  modal.classList.add('open');
  if (onOpen) onOpen();
}
function closeModal(){ modal.classList.remove('open'); modalBox.innerHTML = ''; }
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

/** 通用表单模态：fields=[{key,label,type,options,value,placeholder,hint}] */
function formModal(title, fields, onSubmit, submitLabel){
  const body = fields.map(f => {
    const val = f.value === undefined || f.value === null ? '' : f.value;
    let input;
    if (f.type === 'textarea') input = '<textarea name="' + f.key + '" placeholder="' + esc(f.placeholder||'') + '">' + esc(val) + '</textarea>';
    else if (f.type === 'select') input = '<select name="' + f.key + '">' + (f.options||[]).map(o =>
      '<option value="' + esc(o) + '"' + (String(o) === String(val) ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    else input = '<input name="' + f.key + '" type="' + (f.type||'text') + '" value="' + esc(val) + '" placeholder="' + esc(f.placeholder||'') + '">';
    return '<div style="margin-bottom:12px"><label class="f">' + esc(f.label) + (f.hint ? ' <span class="dim">' + esc(f.hint) + '</span>' : '') + '</label>' + input + '</div>';
  }).join('');
  openModal(title, '<form id="mform">' + body +
    '<div class="foot"><button type="button" class="btn" onclick="closeModal()">取消</button>' +
    '<button type="submit" class="btn primary">' + esc(submitLabel || '确定') + '</button></div></form>');
  $('mform').onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    try { await onSubmit(data); closeModal(); }
    catch(err){ toast(err.message, true); }
  };
}
function confirmAction(msg, fn){
  openModal('请确认', '<p class="muted">' + esc(msg) + '</p><div class="foot">' +
    '<button class="btn" onclick="closeModal()">取消</button>' +
    '<button class="btn danger" id="okBtn">确定</button></div>');
  $('okBtn').onclick = async () => { closeModal(); try { await fn(); } catch(e){ toast(e.message, true); } };
}
function setTimers(fns){ state.timers.forEach(clearInterval); state.timers = fns.map(f => setInterval(f, 4000)); }

/* ==================== 背景轮换 ==================== */
let bgIndex = (new Date().getHours() % 15) + 1;
function applyBg(){
  $('bg').style.backgroundImage = "url('/static/bg_images/bg_" + String(bgIndex).padStart(2,'0') + ".jpg')";
}
setInterval(() => { bgIndex = (bgIndex % 15) + 1; applyBg(); }, 300000);
applyBg();

/* ==================== 顶栏状态 ==================== */
async function refreshPills(){
  try {
    const q = await api('api/queue');
    $('pillQueue').textContent = '队列 ' + q.queue_depth + ' · 并发 ' + q.active + '/' + q.workers;
  } catch(e){ $('pillQueue').textContent = '队列 –'; }
  try {
    const p = await api('api/proxy-status?probe=0');
    const el = $('pillProxy');
    el.textContent = p.connected ? ('IP ' + (p.ip || '已连接')) : '代理未连接';
    el.className = 'pill ' + (p.connected ? 'ok' : 'bad');
  } catch(e){ $('pillProxy').textContent = '代理 –'; }
}
$('verLine').textContent = 'v{{VERSION}}' + (IS_DESKTOP ? ' · 桌面版' : '');
$('modeLine').textContent = IS_DEMO ? '演示模式：任务使用内置示例成片' : '生产模式：真实调用 Dola';
$('aiLine').textContent = AI_READY ? 'AI 推理：已配置' : 'AI 推理：本地规则降级';
$('pillMode').textContent = IS_DEMO ? '演示模式' : '生产模式';
$('pillMode').className = 'pill ' + (IS_DEMO ? 'warn' : 'ok');

/* ==================== 路由 ==================== */
const TITLES = {dashboard:'概览', generate:'生成', storyboard:'分镜工作台', canvas:'节点画布',
  tasks:'任务队列', accounts:'账号池', proxies:'代理与 IP', assets:'资产库', keys:'API 密钥',
  settings:'设置', logs:'日志'};
const PAGES = {dashboard:pageDashboard, generate:pageGenerate, storyboard:pageStoryboard,
  canvas:pageCanvas, tasks:pageTasks, accounts:pageAccounts, proxies:pageProxies,
  assets:pageAssets, keys:pageKeys, settings:pageSettings, logs:pageLogs};

function nav(){
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === state.page);
    b.onclick = () => { state.page = b.dataset.page; $('sidebar').classList.remove('open'); render(); };
  });
}
async function render(){
  state.timers.forEach(clearInterval); state.timers = [];
  nav();
  $('pageTitle').textContent = TITLES[state.page] || state.page;
  view.innerHTML = '<div class="empty">加载中…</div>';
  try { await PAGES[state.page](); }
  catch(e){ view.innerHTML = '<div class="panel"><h2>加载失败</h2><p class="muted">' + esc(e.message) +
    '</p><button class="btn" onclick="render()">重试</button></div>'; }
  refreshPills();
}

/* ==================== 概览 ==================== */
async function pageDashboard(){
  const [stats, queue, tasks, proxy] = await Promise.all([
    api('api/stats'), api('api/queue'), api('api/tasks?limit=8'), api('api/proxy-status?probe=0')]);
  const cards = [
    ['可用账号', stats.active_accounts, '共 ' + stats.total_accounts + ' 个 · 失效 ' + stats.invalid_accounts, 'var(--ok)'],
    ['正在生成', stats.running_tasks, '并发 ' + queue.active + '/' + queue.workers + ' · 排队 ' + stats.queued_tasks, '#7bc8e2'],
    ['24h 成片', stats.today_completed, '累计完成 ' + stats.completed_tasks, 'var(--brand)'],
    ['失败任务', stats.failed_tasks, '可一键重试', 'var(--bad)'],
  ];
  view.innerHTML =
    '<div class="grid g4" style="margin-bottom:16px">' + cards.map(c =>
      '<div class="stat"><div class="k">' + c[0] + '</div><div class="v" style="color:' + c[3] + '">' + c[1] +
      '</div><div class="s">' + esc(c[2]) + '</div></div>').join('') + '</div>' +
    '<div class="grid g2">' +
      '<div class="panel"><h2>⚡ 快速开始</h2>' +
        '<p class="muted" style="margin-top:0">' + (IS_DEMO
          ? '当前是<b>演示模式</b>：提交任务后约 6 秒生成内置示例成片，无需真实账号与代理，可完整走通流程。'
          : '当前是<b>生产模式</b>：任务会通过 <span class="mono">gen/dola_gen_clean.py</span> 调用 Dola 生成真实视频。') + '</p>' +
        '<div class="row"><button class="btn primary" onclick="go(\'generate\')">✧ 去生成视频</button>' +
        '<button class="btn" onclick="go(\'storyboard\')">✦ 分镜工作台</button>' +
        '<button class="btn" onclick="go(\'accounts\')">♧ 导入账号</button>' +
        '<button class="btn" onclick="go(\'canvas\')">⚡ 节点画布</button></div>' +
        '<div class="grid g2" style="margin-top:16px">' +
          '<div class="card"><div class="k muted">磁盘占用（成片）</div><div style="font-size:18px;font-weight:600">' + fmtBytes(stats.output_bytes) + '</div></div>' +
          '<div class="card"><div class="k muted">资产 / 工作流</div><div style="font-size:18px;font-weight:600">' + stats.total_assets + ' / ' + stats.total_workflows + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="panel"><h2>◈ 出口 IP</h2>' +
        '<div class="card"><div class="row between"><div><div class="muted" style="font-size:12px">状态</div>' +
        '<div style="font-size:20px;font-weight:700;color:' + (proxy.connected ? 'var(--ok)' : 'var(--bad)') + '">' +

function taskTable(tasks, compact){
  if (!tasks.length) return '<div class="empty">暂无任务</div>';
  return '<div class="scroll-x"><table><thead><tr>' +
    '<th>ID</th><th>提示词</th>' + (compact ? '' : '<th>参数</th>') +
    '<th>账号</th><th>状态</th>' + (compact ? '' : '<th>创建时间</th>') + '<th>操作</th>' +
    '</tr></thead><tbody>' + tasks.map(t =>
      '<tr><td class="mono">' + esc(t.id) + '</td>' +
      '<td style="max-width:340px"><div style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' +
        esc((t.prompt || '').slice(0, 160)) + '</div></td>' +
      (compact ? '' : '<td class="dim mono">' + esc(t.model || '') + ' · ' + (t.duration || 0) + 's · ' + esc(t.ratio || '') + '</td>') +
      '<td class="dim">' + (t.account_id ? '#' + t.account_id : '自动') + '</td>' +
      '<td>' + statusBadge(t.status) +
        (t.status === 'running' || t.status === 'queued'
          ? '<div class="bar" style="margin-top:6px"><i style="width:' + (t.progress || 0) + '%"></i></div>' +
            '<div class="dim" style="font-size:11px;margin-top:3px">' + esc((t.result || '').slice(0, 40)) + '</div>'
          : (t.status === 'failed' ? '<div class="dim" style="font-size:11px;margin-top:4px;max-width:220px">' + esc((t.error || t.result || '').slice(0, 80)) + '</div>' : '')) +
      '</td>' +
      (compact ? '' : '<td class="dim" style="white-space:nowrap">' + fmtTime(t.created_at) + '</td>') +
      '<td style="white-space:nowrap">' +
        (t.video_url ? '<button class="btn sm" onclick="playVideo(\'' + t.video_url + '\',\'' + esc(t.id) + '\')">▶ 播放</button> ' : '') +
        (t.status === 'failed' ? '<button class="btn sm" onclick="retryTask(\'' + t.id + '\')">↻ 重试</button> ' : '') +
        ((t.status === 'running' || t.status === 'queued')
          ? '<button class="btn sm danger" onclick="cancelTask(\'' + t.id + '\')" title="停止这条任务">■ 停止</button> ' : '') +
        (compact ? '' : '<button class="btn sm danger" onclick="deleteTask(\'' + t.id + '\')">✕</button>') +
      '</td></tr>').join('') + '</tbody></table></div>';
}

/* ==================== 生成页 ==================== */
/* 生成页：先渲染骨架，之后只刷新动态区域——绝不整页重渲染，
   否则每 4 秒会把已经填好的提示词、上传的参考图全清掉（也会闪）。*/
/* 生成页草稿：切到左边任何页面再回来，提示词 / 选项 / 已上传的参考图都还在。
   存在 localStorage 里，所以按 F5 刷新、甚至重开程序也不会丢。 */
const GEN_FORM_KEY = 'dola.genForm.v1';
function genFormLoad(){
  try { return JSON.parse(localStorage.getItem(GEN_FORM_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function genFormSave(patch){
  try {
    const next = Object.assign(genFormLoad(), patch || {});
    localStorage.setItem(GEN_FORM_KEY, JSON.stringify(next));
    return next;
  } catch(e){ return {}; }
}
function genFormPatch(){
  const pick = id => ($(id) ? $(id).value : '');
  return { prompt: pick('genPrompt'), model: pick('genModel'), duration: pick('genDuration'),
           ratio: pick('genRatio'), quality: pick('genQuality'), copies: pick('genCopies'),
           account: pick('genAccount'),
           split: ($('genSplitBatch') && $('genSplitBatch').checked) ? 'batch' : 'single' };
}

        '<div><label class="f">模型</label><select id="genModel">' +
          '<option value="seedance_v2.0">Dreamina Seedance 2.0 Fast（默认，5/10/15 秒）</option>' +
          '<option value="seedance_v2.5">Dreamina Seedance 2.5（30 秒 · 🧩 扩展内核）</option>' +
        '</select></div>' +
        '<div><label class="f">时长</label><select id="genDuration"><option>10</option><option>15</option><option>5</option></select></div>' +
        '<div><label class="f">比例</label><select id="genRatio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div>' +
        '<div><label class="f">画质</label><select id="genQuality"><option>720p</option><option>1080p</option><option>480p</option></select></div>' +
      '</div>' +
      '<div class="row" style="margin-top:12px">' +
        '<div style="width:150px"><label class="f">每条重复次数</label><input id="genCopies" type="number" min="1" max="20" value="1"></div>' +
        '<div style="flex:1;min-width:200px"><label class="f">指定账号（默认自动选号）</label><select id="genAccount"><option value="">自动选择（按队列挑可用账号）</option></select></div>' +
      '</div>' +
      '<div style="margin-top:12px"><label class="f">参考图（可选，最多 9 张，上传后不会丢）</label>' +
        '<input type="file" id="genRefs" accept="image/*" multiple>' +
        '<div id="refThumbs" class="row" style="margin-top:8px;flex-wrap:wrap;gap:10px"></div>' +
        '<div class="dim" id="refHint" style="font-size:12px;margin-top:6px"></div></div>' +
      '<div class="row" style="margin-top:16px"><button class="btn primary" id="genSubmit">✧ 提交任务</button>' +
        '<button class="btn" onclick="openAiAssist()">✦ AI 帮我写提示词</button>' +
        '<button class="btn" id="genProbe" title="检查网络 / 登录态 / 提交端点，确认所选模型能不能用">🩺 模型体检</button>' +
        '<span class="dim" id="genHint"></span></div>' +
    '</div>' +
    '<div><div class="panel"><h2>☷ 队列状态</h2><div id="genQueueBox">' +
      '<div class="grid g2">' +
        '<div class="card"><div class="k muted">排队中</div><div id="genQueueDepth" style="font-size:22px;font-weight:700">0</div></div>' +
        '<div class="card"><div class="k muted">执行中</div><div id="genActiveText" style="font-size:22px;font-weight:700;color:#7bc8e2">0/0</div></div>' +
      '</div></div></div>' +
      '<div class="panel"><h2>▶ 最近成片</h2><div class="video-box" id="genLatestBox">' +
        '<video id="genLatestVideo" controls style="display:none"></video>' +
        '<div id="genLatestEmpty" class="dim">暂无成片</div></div></div>' +
    '</div>' +
  '</div>' +
  '<div class="panel"><h2>最近任务</h2><div id="genTasksBox"><span class="dim">加载中…</span></div></div>';

  // 参考图：状态存在 state 上（页内任何局部刷新都不会丢），首次进来从草稿恢复
  const draft = genFormLoad();
  if (!Array.isArray(state.genRefs)) state.genRefs = Array.isArray(draft.refs) ? draft.refs : [];
  const paintRefs = () => {
    const box = $('refThumbs');
    if (!box) return;
    box.innerHTML = state.genRefs.map((r, i) =>
      '<div class="ref-thumb" title="' + esc(r.path || '') + '">' +
        '<img class="thumb" src="' + esc(r.url) + '">' +
        '<button type="button" class="ref-del" title="移除这张参考图" onclick="removeGenRef(' + i + ')">✕</button>' +
      '</div>').join('');
    if ($('refHint')) $('refHint').textContent = state.genRefs.length
      ? ('已上传 ' + state.genRefs.length + ' 张：' + state.genRefs.map(r => String(r.path || '').split(/[\\/]/).pop()).join('、') + '（点缩略图右上角 ✕ 可单张移除）')
      : '还没有参考图';
    genFormSave({ refs: state.genRefs });
  };
  window.removeGenRef = (i) => {
    if (!Array.isArray(state.genRefs)) return;
    const gone = state.genRefs.splice(i, 1)[0];
    paintRefs();
    if (gone) toast('已移除参考图 ' + String(gone.path || '').split(/[\\/]/).pop());
  };
  paintRefs();

  // 恢复上次填的内容（切页 / 刷新都不丢）
  const setVal = (id, v) => { const el = $(id); if (el && v !== undefined && v !== null && v !== '') el.value = v; };
  setVal('genPrompt', draft.prompt);
  setVal('genModel', draft.model);
  setVal('genQuality', draft.quality);
  setVal('genRatio', draft.ratio);
  setVal('genCopies', draft.copies);
  // 提交方式：默认单条（整段算一条）。旧草稿里没这个字段 = 单条
  if (draft.split === 'batch' && $('genSplitBatch')) $('genSplitBatch').checked = true;
  else if ($('genSplitSingle')) $('genSplitSingle').checked = true;

  // 2.5 只支持 10/30 秒，2.0 支持 5/10/15 —— 选错会被后端悄悄改掉，这里直接限制，别让人猜
  const syncDurations = (reset) => {
    const model = $('genModel').value;
    const allowed = model === 'seedance_v2.5' ? ['30', '10'] : ['10', '15', '5'];
    const sel = $('genDuration');
    const keep = reset ? '' : sel.value;
    sel.innerHTML = allowed.map(v => '<option>' + v + '</option>').join('');
    sel.value = allowed.indexOf(keep) >= 0 ? keep : (model === 'seedance_v2.5' ? '30' : '10');
    const hint = $('genHint');
    if (hint) hint.textContent = model === 'seedance_v2.5'
      ? ('🧩 2.5 走扩展内核：提交时自动用这个账号的带扩展浏览器，页面自己签名（30 / 10 秒）'
         + (IS_DESKTOP ? '' : '；网页版没有本机浏览器，2.5 只能在桌面版用'))
      : '已选 Dreamina Seedance 2.0 Fast（直连提交，支持 5 / 10 / 15 秒）';
  };
  $('genModel').onchange = () => { syncDurations(true); genFormSave(genFormPatch()); };
  syncDurations(false);
  // 时长：草稿里那个值还合法就用它（否则用默认）
  if (draft.duration && Array.from($('genDuration').options).some(o => o.value === String(draft.duration)))
    $('genDuration').value = String(draft.duration);

  // 指定账号：直接列出账号池，不用再记 ID
  const fillAccounts = async (want) => {
    const sel = $('genAccount');
    if (!sel) return;
    let list = [];
    try { list = await api('api/accounts'); } catch(e){ list = []; }
    const keep = (want !== undefined ? String(want) : String(sel.value || draft.account || ''));
    if (!Array.isArray(list) || !list.length){
      sel.innerHTML = '<option value="">账号池是空的，先去【账号池】导入</option>';
      genFormSave({ account: '' });
      return;
    }
    sel.innerHTML = '<option value="">自动选择（按队列挑可用账号）</option>' + list.map(a => {
      const st = String(a.status || '');
      const bad = st && !['ready','ok','local_ready'].includes(st);
      const label = '#' + a.id + ' ' + (a.name || '') + (bad ? '（' + st + '）' : '');
      return '<option value="' + a.id + '">' + esc(label) + '</option>';
    }).join('');
    sel.value = Array.from(sel.options).some(o => o.value === keep) ? keep : '';
    genFormSave({ account: sel.value });
  };
  fillAccounts();

  // 单条 / 批量：只有明确切到「按行拆分」才会拆任务，否则整段（含换行）就是 1 条
  const splitMode = () => ($('genSplitBatch') && $('genSplitBatch').checked) ? 'batch' : 'single';
  const promptLines = () => {
    const raw = ($('genPrompt') || {}).value || '';
    if (splitMode() === 'batch') return raw.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    const whole = raw.trim();
    return whole ? [whole] : [];
  };
  const updateSplitHint = () => {
    const raw = ($('genPrompt') || {}).value || '';
    const copies = Math.max(1, Math.min(20, Number(($('genCopies') || {}).value) || 1));
    const lines = promptLines();
    const total = lines.length * copies;
    const hint = $('genSplitHint'), count = $('genCountHint'), btn = $('genSubmit');
    if (hint) {
      if (!lines.length) {
        hint.innerHTML = '还没有提示词。';
      } else if (splitMode() === 'batch') {
        const blanks = raw.split(/\r?\n/).length - lines.length;
        hint.innerHTML = '按行拆分：检测到 <b>' + lines.length + '</b> 行 → 本次提交 <b>' + total +
          '</b> 条任务' + (copies > 1 ? '（每行 × ' + copies + ' 次）' : '') +
          (blanks > 0 ? '；空行会自动忽略' : '') + '。除非你确实想一次生成多段视频，否则请切回「单条任务」。';
      } else {
        const brk = (raw.match(/\n/g) || []).length;
        hint.innerHTML = '单条任务：整段文字会作为 <b>1</b> 条提示词提交' +
          (brk ? '（里面有 ' + brk + ' 处换行，<b>不会</b>被拆开）' : '') +
          (copies > 1 ? '；同一提示词重复 ' + copies + ' 次 → 共 <b>' + total + '</b> 条任务' : '') + '。';
      }
    }
    if (count) count.textContent = total ? '本次：' + total + ' 条' : '';
    if (btn) btn.textContent = total > 1 ? ('✧ 提交 ' + total + ' 条任务') : '✧ 提交任务';
  };
  ['genPrompt','genModel','genDuration','genRatio','genQuality','genCopies','genAccount'].forEach(id => {
    const el = $(id); if (!el) return;
    el.addEventListener('input', () => { genFormSave(genFormPatch()); if (id === 'genPrompt' || id === 'genCopies') updateSplitHint(); });
    el.addEventListener('change', () => { genFormSave(genFormPatch()); if (id === 'genCopies') updateSplitHint(); });
  });
  ['genSplitSingle','genSplitBatch'].forEach(id => {
    const el = $(id); if (!el) return;
    el.addEventListener('change', () => { genFormSave(genFormPatch()); updateSplitHint(); });
  });
  updateSplitHint();
  genFormSave(genFormPatch());

  $('genProbe').onclick = () => probeModel();

  $('genRefs').onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';                       // 允许再次选同一张
    if (!files.length) return;
    for (const f of files){
      if (state.genRefs.length >= 9){ toast('最多 9 张参考图', true); break; }
      const fd = new FormData(); fd.append('file', f);
      try {
        $('refHint').textContent = '正在上传 ' + f.name + ' …';
        const r = await api('api/upload-image', {method:'POST', body: fd});
        state.genRefs.push({path: r.path, url: r.url});
        paintRefs();
        genFormSave({ refs: state.genRefs });
      } catch(err){
        paintRefs();
        toast('上传失败：' + err.message, true);
      }
    }
  };
  $('genSubmit').onclick = async () => {
    const lines = promptLines();
    if (!lines.length) return toast('请先填写提示词', true);
    const copies = Math.max(1, Math.min(20, Number($('genCopies').value) || 1));
    const accountId = Number($('genAccount').value) || null;
    genFormSave(genFormPatch());
    const items = [];
    lines.forEach(p => { for (let i = 0; i < copies; i++) items.push({prompt: p}); });
    if (items.length > 500) return toast('单次最多 500 条', true);
    const doSubmit = async () => {
      $('genSubmit').disabled = true;
      try {
        const r = await api('api/tasks', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({tasks: items, model: $('genModel').value, duration: Number($('genDuration').value),
            ratio: $('genRatio').value, quality: $('genQuality').value, account_id: accountId,
            ref_images: state.genRefs.map(x => x.path).join(',')})});
        toast('已提交 ' + r.count + ' 条任务（' + (splitMode() === 'batch' ? '按行拆分' : '整段一条') + '），队列 ' + r.queue_depth);
        state.page = 'tasks'; render();
      } catch(e){ toast(e.message, true); }
      finally { const b = $('genSubmit'); if (b) b.disabled = false; }
    };
    // 会生成多条时再确认一次：避免「本来只想做一条，却因为上次切过批量而默默拆开」
    if (items.length > 1) {
      confirmAction('这次会提交 ' + items.length + ' 条任务（' + (splitMode() === 'batch' ? '按行拆分' : '同一提示词重复 ' + copies + ' 次') +
        '）。确定要继续吗？如果你想只做一条，请选「单条任务」并确认重复次数是 1。', doSubmit);
      return;
    }
    await doSubmit();
  };

  await refreshGenDynamic();
  // 只刷新队列/成片/最近任务这三块，不再碰表单
  setTimers([refreshGenDynamic]);
}

async function refreshGenDynamic(){
  const [queue, tasks] = await Promise.all([api('api/queue'), api('api/tasks?limit=6')]);
  if (!$('genQueueBox')) return;                    // 已经切走了就别动

  // 队列数字：只改文本（以前是整块 innerHTML 重建，会闪）
  const qd = $('genQueueDepth'); if (qd) qd.textContent = String(queue.queue_depth);
  const at = $('genActiveText'); if (at) at.textContent = queue.active + '/' + queue.workers;

  // 最近成片：video 元素始终是同一个，只换 src —— 以前每 4 秒重建一次 <video>，
  // 浏览器就把视频重新加载一遍，看着就是「一直在闪」。
  const v = $('genLatestVideo'), empty = $('genLatestEmpty');
  const latest = tasks.find(t => t.video_url);
  const wantSrc = latest ? latest.video_url : '';
  if (v) {
    const nowSrc = v.getAttribute('src') || '';
    if (wantSrc && nowSrc !== wantSrc) {
      const keepTime = nowSrc ? v.currentTime : 0;
      v.setAttribute('src', wantSrc);
      v.style.display = '';
      if (keepTime) { try { v.currentTime = keepTime; } catch (e) {} }
    } else if (!wantSrc && nowSrc) {
      v.removeAttribute('src');
      try { v.load(); } catch (e) {}
      v.style.display = 'none';
    }
    if (wantSrc) v.style.display = '';
  }
  if (empty) empty.style.display = latest ? 'none' : '';

  // 最近任务：按任务 id 增量更新，只有内容真变了才碰 DOM
  const tb = $('genTasksBox');
  if (tb) updateTaskRows(tb, tasks);
}

/* 最近任务表：同一行始终是同一个 DOM 节点，只更新变化的单元格。
   （以前每次刷新都 innerHTML 重建整张表，任务在跑时每 4 秒闪一下。） */
function updateTaskRows(box, tasks){
  if (!tasks.length) {
    if (!box.querySelector('.empty')) box.innerHTML = '<div class="empty">暂无任务</div>';
    return;
  }
  let tbody = box.querySelector('tbody');
  if (!tbody) {
    box.innerHTML = '<div class="scroll-x"><table><thead><tr><th>ID</th><th>提示词</th>' +
      '<th>账号</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div>';
    tbody = box.querySelector('tbody');
  }
  const seen = new Set();
  tasks.forEach((t, idx) => {
    seen.add(String(t.id));   // dataset 里是字符串，这里必须同样用字符串，否则刚插入的行会被当成「已消失」删掉
    let row = tbody.querySelector('tr[data-id="' + t.id + '"]');
    if (!row) { row = buildTaskRow(t); row.dataset.id = t.id; }
    if (tbody.children[idx] !== row) tbody.insertBefore(row, tbody.children[idx] || null);
    updateTaskRow(row, t);
  });
  Array.from(tbody.children).forEach(r => { if (!seen.has(String(r.dataset.id))) r.remove(); });
}

function buildTaskRow(t){
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td class="mono"></td>' +
    '<td style="max-width:340px"><div class="prompt-cell" style="display:-webkit-box;-webkit-line-clamp:2;' +
      '-webkit-box-orient:vertical;overflow:hidden"></div></td>' +
    '<td class="dim account-cell"></td>' +
    '<td><div class="status-cell"></div></td>' +
    '<td style="white-space:nowrap"><div class="act-cell"></div></td>';
  return tr;
}

function updateTaskRow(tr, t){
  const set = (sel, text) => {
    const el = tr.querySelector(sel);
    if (el && el.textContent !== text) el.textContent = text;
  };
  set('td.mono', t.id);
  set('.prompt-cell', (t.prompt || '').slice(0, 160));
  set('.account-cell', t.account_id ? '#' + t.account_id : '自动');
  const statusCell = tr.querySelector('.status-cell');
  const progress = (t.status === 'running' || t.status === 'queued')
    ? '<div class="bar" style="margin-top:6px"><i style="width:' + (t.progress || 0) + '%"></i></div>' +
      '<div class="dim" style="font-size:11px;margin-top:3px">' + esc((t.result || '').slice(0, 40)) + '</div>'
    : (t.status === 'failed'
        ? '<div class="dim" style="font-size:11px;margin-top:4px;max-width:220px">' +
          esc((t.error || t.result || '').slice(0, 80)) + '</div>' : '');
  const sig = [t.status, t.progress, t.result, t.error].join('|');
  if (statusCell && statusCell.dataset.sig !== sig) {
    statusCell.dataset.sig = sig;
    statusCell.innerHTML = statusBadge(t.status) + progress;
  }
  const actCell = tr.querySelector('.act-cell');
  const actSig = [t.video_url || '', t.status].join('|');
  if (actCell && actCell.dataset.sig !== actSig) {
    actCell.dataset.sig = actSig;
    actCell.innerHTML =
      (t.video_url ? '<button class="btn sm" onclick="playVideo(\'' + t.video_url + '\',\'' + esc(t.id) + '\')">▶ 播放</button> ' : '') +
      (t.status === 'failed' ? '<button class="btn sm" onclick="retryTask(\'' + t.id + '\')">↻ 重试</button> ' : '') +
      ((t.status === 'running' || t.status === 'queued')
        ? '<button class="btn sm danger" onclick="cancelTask(\'' + t.id + '\')" title="停止这条任务">■ 停止</button> ' : '');
  }
}
async function probeModel(){

  const syncProbeReal = () => {

      : '';
  };
  $('probeModel').onchange = syncProbeReal;

  $('probeRun').onclick = async () => {
    const btn = $('probeRun');
    btn.disabled = true; btn.textContent = '体检中…';
    $('probeResult').innerHTML = '<div class="dim" style="font-size:13px">正在检查，最长约 30 秒…</div>';

      $('probeResult').innerHTML = '<div class="badge bad">体检失败：' + esc(e.message) + '</div>';
    } finally {
      btn.disabled = false; btn.textContent = '再体检一次';

}

}

async function submitScenes(indexes){
  const items = indexes.map(i => state.scenes[i]).filter(s => (s.prompt || '').trim());
  if (!items.length) return toast('没有可提交的提示词', true);
  try {
    const payload = items.map(s => ({prompt: s.prompt, duration: Number(s.duration) || 15, ratio: s.ratio || '9:16',
      model: (Number(s.duration) || 15) <= 15 ? 'seedance_v2.0' : 'seedance_v2.5',
      ref_images: s.ref_image || ''}));
    const r = await api('api/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({tasks: payload})});
    indexes.forEach((idx, k) => {
      if (state.scenes[idx]) { state.scenes[idx].task_id = r.ids[k]; state.scenes[idx].status = 'queued'; state.scenes[idx].progress = 0; }
    });
    saveScenes(state.scenes); renderScenes();
    toast('已提交 ' + r.count + ' 个镜头任务');
  } catch(e){ toast(e.message, true); }
}
async function pollScenes(){
  const ids = state.scenes.filter(s => s.task_id && s.status !== 'completed').map(s => s.task_id);
  if (!ids.length) return;
  try {
    const tasks = await api('api/tasks?limit=500');
    let changed = false;
    state.scenes.forEach(s => {
      if (!s.task_id) return;
      const t = tasks.find(x => x.id === s.task_id);
      if (!t) return;
      if (s.status !== t.status || s.progress !== t.progress || (t.video_url && s.video_url !== t.video_url)){
        s.status = t.status; s.progress = t.progress; s.error = t.error || t.result;
        if (t.video_url) s.video_url = t.video_url;
        changed = true;
      }
    });
    if (changed && state.page === 'storyboard'){ saveScenes(state.scenes); renderScenes(); }
  } catch(e){ /* 忽略轮询错误 */ }
}

/* 扩展卡片：只有桌面版、且程序目录里有 extensions/ 时才「有用」。
   2.5 / 30 秒是网页端靠扩展解锁的；它跑在真正的 Edge/Chrome 里，
   不是 WebView2 内核（微软要求建环境时开 AreBrowserExtensionsEnabled，pywebview 没这个开关）。 */
function extPanel(ext){
  if (!ext || ext.mode !== 'desktop') return '';
  const list = ext.extensions || [];
  const what = list.length
    ? list.map(e => esc(e.name) + (e.version ? ' <span class="dim">v' + esc(e.version) + '</span>' : '')).join('、')
    : '<span class="dim">未检测到扩展（把解压后的目录放到程序目录的 extensions/ 下，里面要有 manifest.json）</span>';
  const ver = ext.browser_version ? ' <span class="dim">v' + esc(ext.browser_version) + '</span>' : '';
  const warn = ext.warning
    ? '<div style="font-size:12px;color:#f5c76b;margin-top:6px;line-height:1.6">⚠️ ' + esc(ext.warning) + '</div>'
    : '';
  const dir = (ext.roots || [])[0] || '';
  return '<div class="panel"><h2>🧩 浏览器扩展 <small>30 秒 / 无水印 / 看 Cookie 靠它；WebView2 内核装不了扩展，所以用本机 Edge 或 Chrome</small></h2>' +
    '<div class="row" style="align-items:flex-start;gap:16px;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:260px">' +
        '<div style="font-size:13px">已识别：' + what + '</div>' +
        '<div class="dim" style="font-size:12px;margin-top:6px">浏览器：' +
          (ext.browser ? '<span class="mono">' + esc(ext.browser) + '</span>' + ver : '没找到 Edge / Chrome') + '</div>' +
        (ext.error ? '<div style="font-size:12px;color:#f5c76b;margin-top:6px">' + esc(ext.error) + '</div>' : '') +
        '<div class="dim" style="font-size:12px;margin-top:6px;line-height:1.7">账号池每行的【🌐 网页】= 用<b>这个账号的 CK</b> 打开带扩展的浏览器；' +
          '想开不带扩展的原生窗口点【🪟 原生】。</div>' +
        warn +
      '</div>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap">' +
        '<button class="btn primary" onclick="openWithExtensions()"' + (ext.can_launch ? '' : ' disabled') +
          ' title="用带扩展的 Edge/Chrome 打开 dola.com（独立 profile，登录一次会记住）">🧩 带扩展浏览器打开</button>' +
        '<button class="btn" onclick="openExtensionManager()"' + (ext.can_open_manager ? '' : ' disabled') +
          ' title="在同一个独立 profile 里打开扩展管理页，手动「加载已解压的扩展程序」">⚙ 手动加载</button>' +
        '<button class="btn" onclick="revealExtensions()"' + (dir ? '' : ' disabled') +
          ' title="在文件管理器里打开扩展目录，方便拖进扩展管理页">📂 扩展文件夹</button>' +
        '<button class="btn" onclick="render()">↻ 重新检测</button>' +
      '</div>' +
    '</div>' +
    '<div class="dim" style="font-size:11.5px;margin-top:8px;line-height:1.7">' +
      '等价命令：<span class="mono">msedge.exe --user-data-dir=&lt;数据目录&gt;\\extension-browser --load-extension=…\\extensions\\dola30 https://www.dola.com/chat/</span>' +
      '<br>扩展目录：<span class="mono">' + esc(dir || '—') + '</span>' +
      '　·　窗口和软件里的账号窗口互不影响，登录态各自保存。</div>' +
  '</div>';
}

function sessionCell(a){
  if (!state.canManageWindows) {
    return '<span class="dim" style="font-size:12px">网页版：点「网页」开新标签</span>';
  }
  const s = (state.sessions && state.sessions[a.id]) || {state:'closed'};
  const st = s.state || 'closed';
  const extTag = s.kind === 'browser' ? '🧩 ' : '';
  const label = extTag + ({closed:'已关闭', preparing:'正在准备', running:'前台显示中', parked:'后台挂起', stale:'挂起（需重连）'}[st] || st);
  const cls = st === 'running' ? 'ok' : st === 'parked' ? 'dim' : st === 'stale' ? 'bad' : st === 'preparing' ? 'dim' : 'dim';
  let btns = '';
  if (st === 'closed') {
    btns = '<button class="btn sm" onclick="sessionAction(' + a.id + ',\'open\')" title="弹出原生窗口显示真站">前台打开</button> ' +
           '<button class="btn sm" onclick="sessionAction(' + a.id + ',\'suspend\')" title="不弹窗，先把登录态和页面准备好">后台挂起</button>';
  } else if (st === 'running') {
    btns = '<button class="btn sm" onclick="sessionAction(' + a.id + ',\'suspend\')" title="收进后台，页面保持存活">挂起</button> ' +
           '<button class="btn sm danger" onclick="sessionAction(' + a.id + ',\'close\')" title="关掉这个账号的窗口">关闭</button>';
  } else {
    btns = '<button class="btn sm primary" onclick="sessionAction(' + a.id + ',\'activate\')" title="显示这个账号的窗口（必要时自动重连登录态）">切换过去</button> ' +
           '<button class="btn sm danger" onclick="sessionAction(' + a.id + ',\'close\')">关闭</button>';
  }
  return '<span class="badge ' + cls + '">' + label + '</span>' +
    '<div style="white-space:nowrap;margin-top:4px">' + btns + '</div>' +
    (s.note ? '<div class="dim" style="font-size:11px">' + esc(s.note) + '</div>' : '');
}

function sessionList(){
  const items = Object.values(state.sessions || {});
  if (!state.canManageWindows) return '<div class="dim">当前是网页版：账号页面在新标签页里打开，没有可挂起的原生窗口。桌面版（exe / desktop.py）才有这条能力。</div>';
  if (!items.length) return '<div class="dim">还没有打开任何账号窗口。点某一行的「后台挂起」可以在不弹窗的情况下先把账号挂到后台。</div>';
  const order = {running:0, preparing:1, parked:2, stale:3, closed:4};
  return '<div class="row" style="flex-wrap:wrap;gap:8px">' + items
    .sort((x, y) => (order[x.state] ?? 9) - (order[y.state] ?? 9) || x.account_id - y.account_id)
    .map(s => {
      const st = s.state || 'closed';
      const label = (s.kind === 'browser' ? '🧩 ' : '') +
        ({running:'▶ 运行中', preparing:'◌ 准备中', parked:'❚❚ 已挂起', stale:'⚠ 需重连'}[st] || st);
      const cls = st === 'running' ? 'ok' : st === 'stale' ? 'bad' : 'dim';
      const acc = (state.accounts || []).find(a => a.id === s.account_id) || {};
      const act = st === 'running'
        ? '<button class="btn sm" onclick="sessionAction(' + s.account_id + ',\'suspend\')">挂起</button>'
        : '<button class="btn sm primary" onclick="sessionAction(' + s.account_id + ',\'activate\')">切换过去</button>';
      return '<div class="card" style="min-width:220px"><div class="row between"><b>#' + s.account_id + ' ' +
        esc(acc.name || s.name || '') + '</b><span class="badge ' + cls + '">' + label + '</span></div>' +
        '<div class="dim" style="font-size:11px;margin-top:4px">' + esc(s.note || '') + '</div>' +
        '<div class="row" style="margin-top:6px">' + act +
        ' <button class="btn sm danger" onclick="sessionAction(' + s.account_id + ',\'close\')">关闭</button></div></div>';
    }).join('') + '</div>';
}

async function refreshSessions(){
  const r = await api('api/desktop/sessions');
  state.sessions = {};
  (r.sessions || []).forEach(s => { state.sessions[s.account_id] = s; });
  state.canManageWindows = !!(r.can_manage || r.mode === 'desktop');
  (state.accounts || []).forEach(a => {                 // 只换单元格内容，页面不重建
    const td = $('sess-' + a.id);
    if (td) td.innerHTML = sessionCell(a);
  });
  const box = $('sessionBox');
  if (box) box.innerHTML = sessionList();
}

async function sessionAction(id, action){
  try {
    const r = await api('api/accounts/' + id + '/session', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({action: action})});
    if (r.mode === 'browser') {          // 网页版：没有原生窗口，退回开标签页
      if (action === 'open' || action === 'activate') { window.open(r.url, '_blank'); }
      else { toast('网页版没有可挂起的原生窗口'); }
    } else {
      const msg = {open:'已在原生窗口打开（标题栏写着 dola.com 就是真站）',
                   suspend:'已挂到后台（不弹窗，登录态和页面先在后台准备好）',
                   activate:'已切到这个账号（登录态被顶掉时会自动重连）',
                   close:'已关闭这个账号的窗口'}[action] || '完成';
      toast(msg);
    }
    await refreshSessions();
  } catch(e){ toast(e.message, true); }
}

async function downloadCk(fmt){
  try {
    const res = await fetch('/api/accounts/export?format=' + encodeURIComponent(fmt), {
      headers: {'X-Admin-Token': localStorage.getItem('dola_token') || ''}});
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { msg = (await res.json()).error || msg; } catch(e){}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="?([^";]+)"?/);
    const name = m ? m[1] : ('dola-ck.' + fmt);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已导出：' + name + '（' + Math.round(blob.size / 1024) + ' KB，存在下载文件夹）');
    closeModal();
  } catch(e){ toast('导出失败：' + e.message, true); }
}

function openAccountBrowser(id){
  // 带扩展的真实 Edge/Chrome + 这个账号的 CK。
  // 正常情况 CK 由程序通过调试端口直接写进浏览器（不等扩展醒过来），

  toast('正在启动带扩展的浏览器…');
  api('api/accounts/' + id + '/browser', {method:'POST', timeout: 60000}).then(r => {
    const exe = (r.browser || '').split(/[\\/]/).pop() || '浏览器';
    if (r.login === 'cdp'){
      toast('✅ ' + exe + ' 已打开 #' + id + '，并写入 ' + (r.cookie_count || 0) + ' 个 Cookie（已登录）');
      if (r.warning) toast(r.warning, true);
      if (typeof refreshSessions === 'function') refreshSessions();
      return;
    }
    if (r.warning) toast(r.warning, true);
    toast(exe + ' 已打开 #' + id + '，正在用扩展写入 CK…（网页右下角会提示）');
    watchBridgeLogin(r.token, id);
  }).catch(e => {
    toast(e.message + '；已退回不带扩展的原生窗口', true);
    openAccountWeb(id);
  });
}

async function watchBridgeLogin(token, id){
  if (!token) return;
  for (let i = 0; i < 25; i++){
    await new Promise(res => setTimeout(res, 1000));
    let st = null;
    try { st = await api('api/desktop/bridge/status?token=' + encodeURIComponent(token), {timeout: 4000}); }
    catch(e){ return; }
    if (st && st.used){
      toast('✅ #' + id + ' 已用 CK 登录（写入 ' + st.count + ' 个 Cookie）');
      if (typeof refreshSessions === 'function') refreshSessions();
      return;
    }
    if (st && st.known === false) return;
  }
  toast('⚠️ 25 秒内没等到登录完成。先看那个窗口是不是已经进了 dola.com：' +
        '进了就说明程序用调试端口写 CK 成功了（这条提示忽略即可）。还停在桥接页的话：' +
        '回账号池再点一次【🌐 网页】；要用扩展兜底就 edge://extensions → 开发者模式 → 加载已解压的扩展程序 → ' +
        '选 extensions\\dola-login（行末有【⚙ 装扩展】）。', true);
}

function openAccountWeb(id){
  // 非桌面版要自己开标签页：先占位再填地址，否则异步回调里的 window.open 会被拦截
  const pre = (IS_DESKTOP || state.canManageWindows) ? null : window.open('', '_blank');
  api('api/accounts/' + id + '/web', {method:'POST'}).then(r => {
    if (r.mode === 'desktop') {
      if (pre) pre.close();
      // 桌面版优先把该账号 Cookie 写进浏览器内核、直接开真站；
      // 注入不了才退回本机代理页 —— 窗口标题栏会写明走的是哪条
      toast('已在原生窗口打开 #' + id + '（标题栏写着 dola.com 就是真站）');
    }
    else if (pre) { pre.location = r.url; }
    else { window.open(r.url, '_blank'); }
  }).catch(e => { if (pre) pre.close(); toast(e.message, true); });
}

      '<button class="btn" onclick="clearLog(\'audits\')">清空审计日志</button>' +
      (IS_DESKTOP ? '' : '<button class="btn" onclick="window.open(\'/docs\',\'_blank\')">打开 API 文档（/docs）</button>') +
      '<button class="btn" onclick="window.open(\'/api/health\',\'_blank\')">健康检查</button>' +
    '</div></div>';
  const save = async (payload, hintEl) => {
    try {
      const r = await api('api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      toast('设置已保存（并发 ' + r.max_concurrency + '）');
      if (hintEl) hintEl.textContent = '已保存';
      refreshPills();
    } catch(e){ toast(e.message, true); }
  };
  $('saveSettings').onclick = () => save({max_concurrency: Number($('setConc').value),
    max_daily_per_account: Number($('setDaily').value), min_bytes_default: Number($('setMinBytes').value)}, $('setHint'));
  $('saveAi').onclick = () => save({ai_api_key: $('setAiKey').value, ai_base_url: $('setAiBase').value, ai_model: $('setAiModel').value});
}
function clearLog(kind){
  confirmAction('清空' + (kind === 'errors' ? '错误' : '审计') + '日志？', async () => {
    await api('api/' + kind, {method:'DELETE'}); toast('已清空'); render();
  });
}

/* ==================== 日志 ==================== */
async function pageLogs(){
  const [errors, audits] = await Promise.all([api('api/errors?limit=200'), api('api/audits?limit=200')]);
  view.innerHTML =
    '<div class="panel"><h2>◉ 错误日志 <small>最近 200 条</small></h2>' +
      '<div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="render()">↻ 刷新</button>' +
      '<button class="btn sm danger" onclick="clearLog(\'errors\')">清空</button></div>' +
      (errors.length ? '<div class="scroll-x"><table><thead><tr><th>时间</th><th>级别</th><th>内容</th></tr></thead><tbody>' +
        errors.map(e => '<tr><td class="dim mono" style="white-space:nowrap">' + fmtTime(e.created_at) + '</td>' +
          '<td><span class="badge ' + (e.level === 'generate' || e.level === 'worker' ? 'bad' : '') + '">' + esc(e.level) + '</span></td>' +
          '<td class="mono">' + esc(e.message) + '</td></tr>').join('') + '</tbody></table></div>'
        : '<div class="empty">暂无错误日志</div>') + '</div>' +
    '<div class="panel"><h2>◴ 审计日志 <small>最近 200 条</small></h2>' +
      '<div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="render()">↻ 刷新</button>' +
      '<button class="btn sm danger" onclick="clearLog(\'audits\')">清空</button></div>' +
      (audits.length ? '<div class="scroll-x"><table><thead><tr><th>时间</th><th>动作</th><th>详情</th></tr></thead><tbody>' +
        audits.map(a => '<tr><td class="dim mono" style="white-space:nowrap">' + fmtTime(a.created_at) + '</td>' +
          '<td><span class="chip">' + esc(a.action) + '</span></td><td class="mono">' + esc(a.detail) + '</td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty">暂无审计日志</div>') + '</div>';
}

/* ==================== 启动 ==================== */
(async function boot(){
  const token = localStorage.getItem('dola_token');
  if (token) {
    // 兼容：URL 带 ?token=xxx 时自动记忆，便于外部调用
    const fromUrl = new URLSearchParams(location.search).get('token');
    if (fromUrl) localStorage.setItem('dola_token', fromUrl);
  }
  nav(); await render();
  setInterval(refreshPills, 8000);
})();
window.addEventListener('error', (e) => console.error('UI error:', e.message));
</script>
